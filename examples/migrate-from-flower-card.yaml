# Before/after reference: paste one mapping into the dashboard card editor,
# not this whole document. Changing type is sufficient; the after block also
# removes the ignored legacy OK threshold. Keep your entity IDs and options.
# battery_ok_level is accepted but ignored and absent from the visual editor.
# bars_per_row, show_care and extra_badges are accepted but ignored by the new card.
# hide_units defaults to false in both modes. true hides only units in full
# mode, or complete gauge value text in compact mode. Both share the photo/species header.
# Migration: https://github.com/lageorgem/ha-material-plant-card#flower-card-compatibility
# Changes: https://github.com/lageorgem/ha-material-plant-card/blob/master/CHANGELOG.md
before:
  type: custom:flower-card
  entity: plant.orhideea
  name: Orchid
  display_type: full
  show_bars: [moisture, conductivity, temperature, illuminance, humidity, dli]
  hide_species: false
  hide_image: false
  hide_units: false
  battery_sensor: sensor.sh_5_battery
  battery_ok_level: 40
  bars_per_row: 6
  show_care: []
  extra_badges: []

after:
  type: custom:material-plant-card
  entity: plant.orhideea
  name: Orchid
  # Default, as in flower-card: grouped metric tiles with summary range bars.
  display_type: full
  # Optional string: summary (default) or graph.
  full_display: summary
  # Omitted history_period defaults to today: midnight in HA's time zone to now.
  # Optional string choices: today, 24h, 3d, 7d, 14d or 30d; inherited by period.
  # Labels: Today, or Daylight · today for daylight-filtered illuminance.
  show_bars: [moisture, conductivity, temperature, illuminance, humidity, dli]
  hide_species: false
  hide_image: false
  hide_units: false
  # Disable with true; history uses recorder statistics, not raw history.
  # Daylight illuminance summaries use 5-minute statistics up to 7 days;
  # 14/30-day summaries use whole hourly buckets inside the daylight window.
  # DLI uses daily maxima from hourly states, including today's partial total.
  hide_history: false
  # Optional per-metric map; these settings are additions, not migration requirements.
  metrics:
    dli:
      # Optional number: 1–30 (default 7); 1 shows Today.
      days: 7
      # Optional string: summary or graph, inherits full_display.
      display: graph
    illuminance:
      # Optional boolean, default true; based on HA location sunrise/sunset.
      daylight_only: true
      # Optional number: minutes after sunrise/before sunset, 0–180, default 30.
      # Golden-hour filter: sunrise + 30 minutes to sunset − 30 minutes.
      # Summary cutoffs land within 5 minutes for windows up to 7 days.
      # Graph line includes night readings; min/max triangles use daylight values.
      # Up to 3 days, daylight_only enables boundary icons above dashed
      # vertical lines styled like the ideal guides.
      daylight_offset: 30
  battery_sensor: sensor.sh_5_battery
  # Default: red below 10%; otherwise neutral, with the number inside the glyph.
  battery_warn_level: 10
  bars_per_row: 6
  show_care: []
  extra_badges: []

# Optional alternative: paste this mapping for circular gauges instead of tiles.
after_compact:
  type: custom:material-plant-card
  entity: plant.orhideea
  name: Orchid
  display_type: compact
  show_bars: [moisture, conductivity, temperature, illuminance, humidity, dli]
  hide_species: false
  hide_image: false
  hide_units: false
  battery_sensor: sensor.sh_5_battery
  battery_warn_level: 10
