# Before/after reference: paste one mapping into the dashboard card editor,
# not this whole document. Replace entity IDs with your own.
# Changing type alone works: show_bars selects types when metrics is absent.
# The first Metrics-list edit converts show_bars to metrics and removes show_bars.
# The after block shows that conversion and removes accepted-but-ignored keys:
# battery_ok_level, bars_per_row, show_care and extra_badges.
# Migration: https://github.com/lageorgem/ha-material-plant-card#flower-card-compatibility
# Changes: https://github.com/lageorgem/ha-material-plant-card/blob/master/CHANGELOG.md
before:
  type: custom:flower-card
  entity: plant.orchid
  name: Orchid
  display_type: full
  show_bars: [moisture, conductivity, temperature, illuminance, humidity, dli]
  hide_species: false
  hide_image: false
  hide_units: false
  battery_sensor: sensor.orchid_battery
  battery_ok_level: 40
  bars_per_row: 6
  show_care: []
  extra_badges: []

after:
  type: custom:material-plant-card
  entity: plant.orchid
  name: Orchid
  display_type: full
  hide_species: false
  hide_image: false
  # Optional boolean, default false: true hides full-mode current-value units
  # and graph hover units, or complete compact gauge value text.
  hide_units: false
  battery_sensor: sensor.orchid_battery
  battery_warn_level: 10
  # Optional ordered list; each entry requires a string type. Order preserved.
  # Entries default to summary, today, plant trigger, DLI days 7,
  # illuminance daylight_only true and daylight_offset 30 minutes.
  metrics:
    - type: moisture
    - type: conductivity
    - type: temperature
    - type: illuminance
    - type: humidity
    - type: dli
      # Optional addition, not required for migration: graph only this tile.
      # Optional string display: summary (default) or graph.
      display: graph
      # Optional number days: 1–30, default 7, including today's partial total.
      days: 7

# For circular gauges, change after.display_type to compact. The same list
# chooses and orders gauges; icons and problem triggers still apply.
