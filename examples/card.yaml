# Full-options example. Replace entity IDs and the image path with your own.
# Configure sensor min/max thresholds in the plant monitor integration.
# Options: https://github.com/lageorgem/ha-material-plant-card#card-options
# Changes: https://github.com/lageorgem/ha-material-plant-card/blob/master/CHANGELOG.md
type: custom:material-plant-card
entity: plant.orhideea
name: Orchid
# Default: grouped metric tiles; change to compact for circular gauges.
display_type: full
show_bars:
  - moisture
  - conductivity
  - temperature
  - illuminance
  - humidity
  - dli
hide_species: false
hide_image: false
# false is the default in both modes. true hides units beside full-mode
# values, or the entire value text below compact-mode gauges.
hide_units: false
# Full only: 24h recorder statistics refresh every 10 minutes.
# Measurement sensors need state_class: measurement; running-total DLI has no 24h data.
hide_history: false
image: /local/plants/orchid.jpg
battery_sensor: sensor.sh_5_battery
# Bare battery glyph turns red below this percentage; otherwise neutral.
battery_warn_level: 10
problem_source: plant
# Empty/omitted allows all measurements; this example selects two.
problem_sensors:
  - moisture
  - dli
# Compatibility-only keys: accepted and ignored.
bars_per_row: 6
show_care: []
extra_badges: []

# Compact alternative: paste this block instead of the full-options mapping above.
# type: custom:material-plant-card
# entity: plant.orhideea
# display_type: compact
# hide_units: false
