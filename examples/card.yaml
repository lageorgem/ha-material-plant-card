# Full-options example. Replace entity IDs and the image path with your own.
# Configure sensor min/max thresholds in the plant monitor integration.
# Options: https://github.com/lageorgem/ha-material-plant-card#card-options
# Changes: https://github.com/lageorgem/ha-material-plant-card/blob/master/CHANGELOG.md
type: custom:material-plant-card
entity: plant.orchid
name: Orchid
# Default: full tiles; choose compact for circular gauges.
display_type: full
hide_species: false
hide_image: false
# Optional boolean, default false: true hides units beside full-mode current
# values and in graph hover bubbles, or complete compact gauge value text.
hide_units: false
image: /local/plants/orchid.jpg
battery_sensor: sensor.orchid_battery
# Optional number, default 10: battery turns red below this percentage.
battery_warn_level: 10
# Optional ordered list; type is required in every entry. Order = display order.
# Defaults per entry: display summary, problem_trigger plant, period today,
# days 7, daylight_only true (illuminance only), daylight_offset 30 minutes.
# Only listed, available metrics can raise measurement-specific problems.
# Full-mode history is always fetched from recorder statistics; refresh: 10 min.
metrics:
  - type: moisture
    # Optional string: plant, out_of_range, low, high or never; default plant.
    problem_trigger: low
    display: summary
    # Optional string: today, 24h, 3d, 7d, 14d or 30d; default today.
    period: 7d
  - type: conductivity
    problem_trigger: never
  - type: temperature
    # Optional string: override the default metric icon in either mode.
    icon: mdi:thermometer-lines
    display: graph
    period: 24h
    problem_trigger: out_of_range
  - type: illuminance
    display: graph
    period: 3d
    # Optional boolean, default true: use HA location's sunrise/sunset.
    daylight_only: true
    # Optional number: 0–180 minutes, rounded/clamped, default 30.
    # Statistics/markers include sunrise + 45 min to sunset − 45 min.
    # The graph line includes night readings; windows up to 3d show boundaries.
    daylight_offset: 45
  - type: humidity
    display: summary
    period: today
  - type: dli
    display: graph
    # Optional number: 1–30, rounded/clamped, default 7; used instead of period.
    # Today is included, partial so far; 1 = Today, otherwise Daily max · N d.
    days: 14

# Visual editor: Metrics → Add metric, drag to reorder, Edit or Delete.
# Compact alternative: change display_type above to compact. Metric order,
# icons and triggers still apply; history/display settings affect full mode only.
# Uncomment these compact-only options after changing display_type:
# gauges_per_row: 3
# gauge_size: 60
# gauges_per_row: optional integer, 1–12; omit for automatic balanced rows.
# Requested rows fill left to right; last row is centred. If the card is too
# narrow, it falls back to automatic rows. Flower-card's bars_per_row is ignored.
# gauge_size: optional number, 32–96 px (clamped), default 44; icon/value scale.
# Visual editor: Display type → Compact → Compact layout.
